version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: insight360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insight360
      POSTGRES_USER: insight360
      POSTGRES_PASSWORD: insight360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d/schema

volumes:
  pgdata:
